name: Update API docs

# pyproject.toml のバージョンが上がったときだけ openapi.json を再生成して
# docs/ に保存する。GitHub Pages の表示が常に最新バージョンの状態になる。
on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 1つ前のコミットと比較するために2つ分取得する

      - name: バージョン変更チェック
        id: check
        shell: bash
        run: |
          CURRENT=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' pyproject.toml)
          PREVIOUS=$(git show HEAD~1:pyproject.toml | sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p')
          echo "現在: $CURRENT / 前回: $PREVIOUS"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  update-docs:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.changed == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Generate openapi.json
        # サーバーを起動せず FastAPI の app オブジェクトから直接生成する。
        # create_engine() は接続を試みないためダミー URL で問題ない。
        env:
          DATABASE_URL_MD: postgresql://dummy:dummy@localhost/dummy
          DATABASE_URL_FOUR: postgresql://dummy:dummy@localhost/dummy
          POSTGRES_PASSWORD: dummy
          POSTGRES_USER: dummy
        run: |
          uv run python -c "
          import json
          from app.main import app
          with open('docs/openapi.json', 'w', encoding='utf-8') as f:
              json.dump(app.openapi(), f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('docs/openapi.json を生成しました')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json
          git diff --staged --quiet && echo "変更なし、スキップ" && exit 0
          VERSION=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' pyproject.toml)
          git commit -m "chore: openapi.json を v${VERSION} に更新"
          git push
