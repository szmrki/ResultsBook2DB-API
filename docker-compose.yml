services:
  # ── FastAPI アプリケーション ──────────────────────────────────
  api:
    build: . # このディレクトリの Dockerfile を使ってイメージをビルド
    container_name: rb2db-api # コンテナの名前（docker ps で表示される）
    ports:
      - "127.0.0.1:8000:8000"   
        # サーバーの localhost のみ
        # 現状は研究室サーバにアクセスできるユーザからのsshトンネルによるアクセスのみを想定
    environment:
      DATABASE_URL_MD: ${DATABASE_URL_MD}
      DATABASE_URL_FOUR: ${DATABASE_URL_FOUR}
    depends_on:
      db:
        condition: service_healthy # db の healthcheck が通過してから api を起動する
    volumes:
      - ./app:/app/app
        # ホストの ./app をコンテナの /app/app にマウント
        # コードを変更すると即座にコンテナに反映される（開発時のみ）
    logging:
      driver: json-file
      options:
        max-size: "10m" # 1ファイルの上限
        max-file: "3"   # 保持するファイル数（合計最大 30MB）
    # コード変更を自動検知して再起動（開発時のみ）
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── MCP サーバー ──────────────────────────────────────────────
  # 研究室メンバーの AI ツールから read-only SQL で分析するためのサーバー。
  # api と同一イメージ（同じ Dockerfile）を使い、command だけ差し替えて起動する。
  mcp:
    build: . # api と同じ Dockerfile / イメージ
    container_name: rb2db-mcp
    ports:
      - "127.0.0.1:8100:8100"
        # api と同様、研究室サーバーの localhost のみ公開。
        # 各メンバーは SSH ポートフォワーディング経由で接続する。
    environment:
      # MCP サーバーは read-only 専用ロールで接続する（書き込み可能なURLは渡さない）。
      DATABASE_URL_MD_RO: ${DATABASE_URL_MD_RO}
      DATABASE_URL_FOUR_RO: ${DATABASE_URL_FOUR_RO}
      # コンテナ内では 0.0.0.0 で待ち受け、ホスト側公開を 127.0.0.1 に限定する。
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
        # 開発時にコード変更を即反映（api と同様）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: uv run python -m app.mcp.server

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:18 # DockerHub の公式 PostgreSQL 18 イメージを使用
    container_name: rb2db-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER} # DBユーザー名
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # DBパスワード
      # POSTGRES_DB は指定しない（docker/init.sql で rb2db_md / rb2db_four を作成）
    # ports の記述を削除
    # コンテナ間通信はdocker-composeの内部ネットワークで十分
    ports:
      - "5432:5432" # ホストから直接 psql で接続したい場合に使う
      
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
        # 初回起動時に rb2db_md / rb2db_four を自動作成する
        # ※ボリュームが既に存在する場合はinitは実行されない（docker compose down -v で再実行）
      - postgres_data:/var/lib/postgresql
        # 名前付きボリュームでデータを永続化
        # PostgreSQL 18+ はバージョン別サブディレクトリ（18/data）に保存するため /data を付けない
        # コンテナを削除してもデータは残る
    healthcheck:
      # コンテナが「起動中」ではなく「接続可能」かを確認する
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s # 5秒ごとにチェック
      timeout: 5s # タイムアウトは5秒
      retries: 5 # 5回失敗したら異常とみなす

volumes:
  postgres_data:
    # 名前付きボリュームの定義
    # docker compose down -v で削除できる
