# 版ごとの変更点。叩き台（2026-10-18）。
# 書き方は README.md §3 を参照。
#
# 各項目:
#   edition:      editions.yaml の id
#   topic:        topics.yaml の id
#   type:         introduced / modified / removed / trial / split / merged
#   summary_ja:   自分の言葉での要約（原文を長く引用しない）
#   before / after: 変更前後の短い説明（必要なときだけ）
#   data_impact:  このデータで何に気をつけるか（分析結果は書かない）
#   source:       原典（sources.yaml の id）・条番号・ページ
#   verified:     人が原文と照らして確認したら true

changes:
  - edition: wcf-2026
    topic: md_positioned_stones
    type: modified
    summary_ja: >-
      ハウス手前側の事前配置ストーン（Position A）を置く基準点が、3 点から 4 点に変わった。
      基準の取り方も「ホッグラインとハウス前端の中間点」から「ハウス前端からの距離」に変わった。
    before: >-
      ホッグラインとハウス前端の中間点、およびそこから 3 フィート（914 mm）前後の計 3 点。
    after: >-
      ハウス前端から 4'6"（1.372 m）・6'6"（1.981 m）・8'6"（2.591 m）・10'6"（3.200 m）の計 4 点。
    data_impact: >-
      md の事前配置ストーン（shots.number = 0 に紐づく stones）のうち、ガード側の y 座標の分布が
      この版を境に変わりうる。rb2db の座標系（Tee Line y = 38.405、ハウス半径 1.829 m）で
      基準点を計算すると、変更前は y ≈ 33.376 / 34.290 / 35.204、変更後は
      y ≈ 33.376 / 33.985 / 34.595 / 35.204（いずれも計算値。ストーンは点の直前か直後に置く）。
      2026-10-11 時点の md データ（すべて変更前の大会）では、ガード側の y はほぼすべて 35.0〜35.3 にあり、
      ハウス寄りの基準点付近に集中している。版をまたいで事前配置ストーンの位置を集計するときは、版ごとに分けること。
    source:
      doc: wcf-2026-changes
      rule: R17 (b) I
      page: 25-26
    verified: true

  - edition: wcf-2022
    topic: no_tick
    type: trial
    summary_ja: >-
      ノーティックルールが試験ルールとして、2022-23 シーズンのすべての大会（MD の大会を除く）で使われた。
      エンドの 5 投目までに、フリーガードゾーン内でセンターラインに触れている相手のストーンを、
      センターラインから外れる位置かフリーガードゾーンの外へ動かした場合、相手チームは
      「投げたストーンを取り除いて元に戻す」か「そのままにする」かを選べる。
    data_impact: >-
      規則書への正式な追加は 2023 年版だが、4 人制の大会では 2022-23 シーズンからノーティックが効いている。
      ノーティックの前後で比べるときは、2022 年版の施行時期ではなく 2022-23 シーズンを境にすること。
      序盤（5 投目まで）のショットの種類やガードの残り方が変わりうる。
    source:
      doc: wcf-2022-trial
      rule: Trial Rule 2022-2023
      page: 2
    verified: true

  - edition: wcf-2023
    topic: no_tick
    type: introduced
    summary_ja: >-
      2022-23 シーズンの試験ルールだったノーティックルールが、規則書に正式に加わった（R7）。
      内容は試験ルールと同じで、車いすカーリングと MD には適用しない。
    data_impact: >-
      試験ルールからの継続なので、2022-23 シーズン以降の 4 人制の大会はすべてノーティックの下で行われている。
      md には関係しない。
    source:
      doc: wcf-2023-changes
      rule: R7
      page: 12
    verified: true
