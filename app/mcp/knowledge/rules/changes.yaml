# 版ごとの変更点。叩き台（2026-10-18）。
# 書き方は README.md §3 を参照。
#
# 各項目:
#   edition:      editions.yaml の id
#   topic:        topics.yaml の id
#   type:         introduced / modified / removed / trial / split / merged
#   summary_ja:   自分の言葉での要約（原文を長く引用しない）
#   before / after: 変更前後の短い説明（必要なときだけ）
#   data_impact:  このデータで何に気をつけるか（分析結果は書かない）
#   source:       原典（sources.yaml の id）・条番号・ページ
#   verified:     人が原文と照らして確認したら true

changes:
  - edition: wcf-2026
    topic: md_positioned_stones
    type: modified
    summary_ja: >-
      ハウス手前側の事前配置ストーン（Position A）を置く基準点が、3 点から 4 点に変わった。
      基準の取り方も「ホッグラインとハウス前端の中間点」から「ハウス前端からの距離」に変わった。
    before: >-
      ホッグラインとハウス前端の中間点、およびそこから 3 フィート（914 mm）前後の計 3 点。
    after: >-
      ハウス前端から 4'6"（1.372 m）・6'6"（1.981 m）・8'6"（2.591 m）・10'6"（3.200 m）の計 4 点。
    data_impact: >-
      md の事前配置ストーン（shots.number = 0 に紐づく stones）のうち、ガード側の y 座標の分布が
      この版を境に変わりうる。rb2db の座標系（Tee Line y = 38.405、ハウス半径 1.829 m）で
      基準点を計算すると、変更前は y ≈ 33.376 / 34.290 / 35.204、変更後は
      y ≈ 33.376 / 33.985 / 34.595 / 35.204（いずれも計算値。ストーンは点の直前か直後に置く）。
      2026-10-18 時点の md データ（すべて変更前の大会）では、ガード側の y はほぼすべて 35.0〜35.3 にあり、
      ハウス寄りの基準点付近に集中している。版をまたいで事前配置ストーンの位置を集計するときは、版ごとに分けること。
    source:
      doc: wcf-2026-changes
      rule: R17 (b) I
      page: 25-26
    verified: true

  - edition: wcf-2022
    topic: no_tick
    type: trial
    summary_ja: >-
      ノーティックルールが試験ルールとして、2022-23 シーズンのすべての大会（MD の大会を除く）で使われた。
      エンドの 5 投目までに、フリーガードゾーン内でセンターラインに触れている相手のストーンを、
      センターラインから外れる位置かフリーガードゾーンの外へ動かした場合、相手チームは
      「投げたストーンを取り除いて元に戻す」か「そのままにする」かを選べる。
    data_impact: >-
      規則書への正式な追加は 2023 年版だが、4 人制の大会では 2022-23 シーズンからノーティックが効いている。
      ノーティックの前後で比べるときは、2022 年版の施行時期ではなく 2022-23 シーズンを境にすること。
      序盤（5 投目まで）のショットの種類やガードの残り方が変わりうる。
    source:
      doc: wcf-2022-trial
      rule: Trial Rule 2022-2023
      page: 2
    verified: true

  - edition: wcf-2023
    topic: no_tick
    type: introduced
    summary_ja: >-
      2022-23 シーズンの試験ルールだったノーティックルールが、規則書に正式に加わった（R7）。
      内容は試験ルールと同じで、車いすカーリングと MD には適用しない。
    data_impact: >-
      試験ルールからの継続なので、2022-23 シーズン以降の 4 人制の大会はすべてノーティックの下で行われている。
      md には関係しない。
    source:
      doc: wcf-2023-changes
      rule: R7
      page: 12
    verified: true

  - edition: wcf-2015
    topic: md_positioned_stones
    type: modified
    summary_ja: >-
      ハウス内の事前配置ストーン（Position B）の位置が、ティー（ハウスの中心）の後ろ端に接する位置から、
      4 フィートの円の後方（ストーンの後ろ端を 4 フィートの円の後ろ端に合わせる位置）に移った。
    before: センターライン上で、ストーンの前端がティーの後ろ端に接する位置。
    after: センターライン上で、ストーンの後ろ端が 4 フィートの円の後ろ端にそろう位置。
    data_impact: >-
      rb2db の座標系で計算すると、ハウス内の置き石の中心は変更前 y ≈ 38.55、変更後 y ≈ 38.87（計算値）。
      2026-10-18 時点の md データでは y ≈ 38.83〜38.87 に集まっており、変更後の位置と一致する。
      md のデータは WMDCC2016（2016 年 4 月）からなので、すべて変更後の大会。
    source:
      doc: wcf-2015-rules
      rule: R15 (f) (ii)
    verified: true

  - edition: wcf-2015
    topic: md_power_play
    type: introduced
    summary_ja: >-
      MD にパワープレーが新設された。1 試合に 1 回、置き石の配置を決める権利を持つチームが選べ、
      ハウス内の置き石をハウスの左右どちらかに（後ろ端をティーラインに付けて）、ガードの置き石を同じ側に置く。
      エキストラエンドでは使えない。
    data_impact: >-
      ends.is_power_play が意味を持つのはこの版以降。md のデータは WMDCC2016 からなので、すべてパワープレーのある規則の下で行われている。
    source:
      doc: wcf-2015-rules
      rule: R15 (f) (iii)
    verified: true

  - edition: wcf-2017
    topic: free_guard_zone
    type: modified
    summary_ja: >-
      フリーガードゾーンの保護が、エンドの 5 投目より前（4 ロックルール）から 6 投目より前（5 ロックルール）に延びた。
      2017 年 10 月の改定で決まり、2018 年 10 月から適用された。
    before: 5 投目より前に、相手のフリーガードゾーンのストーンをプレー外に出してはいけない（4 ロックルール）。
    after: 6 投目より前に、相手のフリーガードゾーンのストーンをプレー外に出してはいけない（5 ロックルール）。
    data_impact: >-
      4 人制では 2018-19 シーズン（2018 年 10 月以降）の大会から 5 ロックルール。rb2db の four では、
      ECC2018（2018 年 11 月）以降が 5 ロックルールで、それより前の大会（OWG2010 から 2018 年春の
      WMCC2018・WWCC2018・WJCC2018 まで）はすべて 4 ロックルールで行われた。
      序盤のガードの残り方やショットの種類、ブランクエンドの割合を時期をまたいで比べるときは分けること。
      MD は別の規定（4 投目より前は置き石を含めてプレー外に出せない）なので関係しない。
    source:
      doc: jca-2017-12-notice
      rule: R6 (b)
    verified: true

  - edition: wcf-2018
    topic: md_placement_after_blank
    type: modified
    summary_ja: >-
      MD で、計測しても同距離でブランクエンドになった場合は、置き石の配置を決める権利が次のエンドも変わらない、
      という例外が加わった。それまでは、ブランクエンドになれば同距離の場合も配置を決める権利が移っていた。
    data_impact: >-
      同距離によるブランクエンドはまれだが、ハンマー（color_hammer）の推移の規則そのものが変わる。
      rb2db を生成するシステムは現行の規則（同距離なら配置を決める権利が移らない）に合わせて処理しているため、
      この版より前の md の大会（WMDCC2016・WMDCC2017・OWG2018・WMDCC2018）では旧規則で処理する必要がある。
    source:
      doc: jca-2018-11
      rule: R15 (g) (iii)
    verified: true

  - edition: wcf-2014
    topic: thinking_time
    type: modified
    summary_ja: >-
      持ち時間の方式が、試合時間（playing time。投球中も時計が進み、10 エンドで 73 分）から、
      考慮時間（thinking time。投球中は時計が止まり、10 エンドで 38 分）に変わった。
    before: 10 エンドで 73 分、8 エンドで 59 分、MD は 46 分の試合時間（playing time）。
    after: 10 エンドで 38 分、8 エンドで 30 分、MD は 22 分の考慮時間（thinking time）。延長は 1 エンドごとに 4 分 30 秒（MD は 3 分）。
    data_impact: >-
      2026-10 時点の rb2db には時間の記録がないので、集計への影響はない。将来、残り時間や使用時間を取り込む場合は、
      この版より前（2014 年冬季五輪など）と後で時間の意味が異なるので、そのまま比べないこと。
    source:
      doc: wcf-2014-rules
      rule: C6 (a)
    verified: true
