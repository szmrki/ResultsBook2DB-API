# 原典（PDF）の台帳。叩き台（2026-10-18）。
# PDF そのものはリポジトリに置かない。ここには URL だけを書く。
# 手元の PDF は gitignore 済みの sources/rules/<publisher>/<url の末尾のファイル名> に置く。
#
# 各項目:
#   id:        changes.yaml / editions.yaml から参照する ID
#   publisher: wcf / jca
#   kind:      rules（規則書） / changes（変更箇所を示した版） / notice（改定案内） / trial（試験ルール）
#   lang:      en / ja
#   url:       元の URL（404 になっているものもある）
#   archive:   Wayback Machine の URL（年だけ指定した形は、最も近い保存日時に飛ぶ）
#   status:    live（元の URL で取得可） / archived（Wayback で確認済み） / partial（一部のファイルが取得できない）
#   missing_parts: 取得できないファイル（Wayback の保存版がすべて途中で切れているなど）
#   parts:     ページ範囲で分割されている場合のファイル名

